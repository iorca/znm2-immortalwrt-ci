name: Build ZN-M2 (VIKINGYFY/immortalwrt owrt)

# 每两周为 ZN-M2 (qualcommax/ipq60xx) 出一次固件，源码取 VIKINGYFY/immortalwrt 的 owrt 分支。
# 不需要 fork 源码仓库：本 workflow 运行时浅克隆 owrt 分支，套上 Config/znm2.seed.config。
# 频率：cron 每周一触发，gate 步骤按 ISO 周奇偶决定——偶数周才真编译（= 每 14 天一次）。
# 手动 workflow_dispatch / 推送 Config 改动不受 gate 限制，始终编译。
#
# 顺序陷阱：easimon/maximize-build-space 会把新 LVM 卷挂到 workspace 路径，盖住已检出文件，
# 所以它必须放在 checkout 之前跑（官方用法即第一步）。

on:
  schedule:
    # 每周一 04:00 (UTC+8) 触发；实际每两周编一次由下方 gate 控制
    - cron: '0 20 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'Config/**'
      - '.github/**'

permissions:
  contents: write   # 发 Release 需要

concurrency:
  group: build-znm2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      # 1) gate 最先跑（不需要仓库），决定是否真编译；奇数周直接秒退
      - name: Biweekly gate (每两周编一次)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WEEK=$(date +%V)
            if [ $((10#$WEEK % 2)) -eq 0 ]; then BUILD=true; else BUILD=false; fi
          else
            BUILD=true
          fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} iso_week=$(date +%V) -> build=${BUILD}"

      # 2) 先扩盘：LVM 会挂到 workspace 路径，必须早于 checkout，否则盖住已检出文件
      - name: Maximize build space
        if: steps.gate.outputs.build == 'true'
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 3) 扩盘后再 checkout，文件才会落到扩容后的卷上
      - name: Checkout CI repo
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Install build dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pip \
            unzip zlib1g-dev file wget rsync patch vim-common ccache ecj \
            libc6-dev-i386 libev-dev
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"

      - name: Clone source (owrt branch, shallow)
        if: steps.gate.outputs.build == 'true'
        run: |
          git clone --depth 1 --branch owrt https://github.com/VIKINGYFY/immortalwrt openwrt

      - name: Restore cache (dl + ccache)
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ${{ github.workspace }}/.ccache
          key: znm2-owrt-cache
          restore-keys: |
            znm2-owrt-cache

      - name: Prepare config
        if: steps.gate.outputs.build == 'true'
        run: |
          OPENWRT="${GITHUB_WORKSPACE}/openwrt"
          ls -l "${GITHUB_WORKSPACE}/Config/"
          # OpenClash 通过独立 feed 引入 (vernesong/OpenClash dev 分支)
          echo "src-git openclash https://github.com/vernesong/OpenClash.git;dev" >> "${OPENWRT}/feeds.conf.default"
          cp "${GITHUB_WORKSPACE}/Config/znm2.seed.config" "${OPENWRT}/.config"
          cd "${OPENWRT}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build
        if: steps.gate.outputs.build == 'true'
        run: |
          cd "${GITHUB_WORKSPACE}/openwrt"
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect source commit & date
        id: meta
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "commit=$(git -C "${GITHUB_WORKSPACE}/openwrt" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-znm2-${{ steps.meta.outputs.date }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/*
          retention-days: 30
          if-no-files-found: error

      # 自动发布：固定 tag + overwrite，每次覆盖同一个 release，永远是“最新一份”，不堆积
      - name: Publish rolling release
        if: steps.gate.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zn-m2-owrt-latest
          overwrite: true
          name: ZN-M2 owrt ${{ steps.meta.outputs.date }}
          body: |
            Source: VIKINGYFY/immortalwrt @ owrt ${{ steps.meta.outputs.commit }}
            Target: qualcommax / ipq60xx / zn_m2
            Built : ${{ steps.meta.outputs.date }} (UTC)
          files: openwrt/bin/targets/qualcommax/ipq60xx/*
